spring.application.name=event-service
server:
port: 8081

spring:
application:
name: event-service
datasource:
url: jdbc:mysql://localhost:3306/eventdb?createDatabaseIfNotExist=true
username: root
password: root
driver-class-name: com.mysql.cj.jdbc.Driver
jpa:
hibernate:
ddl-auto: update
show-sql: true
database-platform: org.hibernate.dialect.MySQL8Dialect

eureka:
client:
service-url:
defaultZone: http://localhost:8761/eureka/
enabled: false   # flip true once Eureka server exists in Step 4

management:
endpoints:
web:
exposure:
include: health,info,prometheus,metrics